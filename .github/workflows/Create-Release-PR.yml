name: Framework Release
on: 
  workflow_dispatch:
    inputs:
      new_version:
        description: "New sdk version"
        required: true
permissions:
  contents: read
jobs:
  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: 
        ref: ${{ github.head_ref }}
        persist-credentials: false
    - name: update version file
      run: |
        sed -i -e "s/OTEL_SWIFT_SDK_VERSION: String = \".*\"/OTEL_SWIFT_SDK_VERSION: String = \"${INPUTS_NEW_VERSION}\"/" "${VERSION_FILE}"
        grep -qF "OTEL_SWIFT_SDK_VERSION: String = \"${INPUTS_NEW_VERSION}\"" "${VERSION_FILE}"
      env:
        INPUTS_NEW_VERSION: ${{ inputs.new_version }}
        VERSION_FILE: Sources/OpenTelemetrySdk/Version.swift

    - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      id: otelbot-token
      with:
        client-id: ${{ vars.OTELBOT_CLIENT_ID }}
        private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
        permission-pull-requests: write

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        # not using secrets.GITHUB_TOKEN since pull requests from that token do not run workflows
        token: ${{ steps.otelbot-token.outputs.token }}
        branch-token: ${{ secrets.GITHUB_TOKEN }}
        branch: release/${{inputs.new_version}}
        commit-message: 'Release ${{inputs.new_version}}'
        title: 'Release ${{inputs.new_version}}'
        delete-branch: true
        body: >
          This PR is auto-generated by 
          [create-pull-request](https://github.com/peter-evans/create-pull-request).
        base: main
