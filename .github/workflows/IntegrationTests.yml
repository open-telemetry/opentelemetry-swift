name: Integration Tests

# Runs Examples/HackerNewsDemo in the iOS simulator against a local mock
# collector and asserts on the exported OTLP payloads (Tests/IntegrationTests).
#
# Pull request runs are bound to the `integration-tests` environment. Configure
# that environment with required reviewers in the repository settings so a
# maintainer has to approve the run before it starts. Pushes to main, the
# nightly schedule and manual runs use `integration-tests-main`, which is left
# unprotected so they run without approval.

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Examples/HackerNewsDemo/**"
      - "Tests/IntegrationTests/**"
      - "Scripts/run-integration-tests.sh"
      - ".github/workflows/IntegrationTests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    environment: ${{ github.event_name == 'pull_request' && 'integration-tests' || 'integration-tests-main' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install Homebrew kegs
        run: make setup-brew
      - name: Cache Swift packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            Tests/IntegrationTests/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-integration-spm-${{ hashFiles('Package.swift', 'Tests/IntegrationTests/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-integration-spm-
      - name: Resolve simulator
        id: ios-sim
        run: echo "udid=$(./Scripts/ci/resolve-simulator.sh iOS)" >> "$GITHUB_OUTPUT"
      - name: Cache OpenTelemetry Collector binary
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: Tests/IntegrationTests/.collector
          key: ${{ runner.os }}-${{ runner.arch }}-otelcol-${{ hashFiles('Scripts/run-integration-tests.sh') }}
      - name: Cache HackerNewsDemo build
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: Tests/IntegrationTests/.derivedData
          key: ${{ runner.os }}-integration-app-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Examples/HackerNewsDemo/**') }}
          restore-keys: |
            ${{ runner.os }}-integration-app-
      - name: Build HackerNewsDemo
        env:
          IOS_SIMULATOR_UDID: ${{ steps.ios-sim.outputs.udid }}
        run: make integ-build-ios
      - name: Run integration tests
        env:
          IOS_SIMULATOR_UDID: ${{ steps.ios-sim.outputs.udid }}
        run: make integ-tests-without-building-ios
      - name: Upload collected telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-telemetry
          path: Tests/IntegrationTests/out
          if-no-files-found: ignore
