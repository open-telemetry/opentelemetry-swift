name: Reply to Assignment Requests
on:
  # no checkout or untrusted code runs; the comment body is only read via env
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
permissions: {}
jobs:
  reply:
    if: >-
      !github.event.issue.pull_request &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: reply if the comment asks to be assigned
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          grep -qiE "assign(ed)? (it |this )?(to )?me|can i (work on|take|pick)|i'?d (like|love|be happy) to (work on|take|fix|pick)|(work on|take|pick up) this|pick (it|this) up|would a pr be welcome" <<< "$BODY" || exit 0
          gh api "repos/$GH_REPO/contents/CODEOWNERS" -H "Accept: application/vnd.github.raw" | grep -o '@[A-Za-z0-9-]*' | tr -d @ | grep -qixF "$AUTHOR" && exit 0
          gh issue view "$ISSUE" --json comments --jq '.comments[].author.login' | grep -qx 'github-actions' && exit 0
          gh issue comment "$ISSUE" --body "Hi there, thanks for offering to help! You don't need to wait to be assigned. If this issue has no assignee, please go ahead and open a PR (a draft is fine if you'd like early feedback), and a maintainer will review it. There's more in [Picking up an issue](https://github.com/open-telemetry/opentelemetry-swift/blob/main/CONTRIBUTING.md#picking-up-an-issue)."
