name: Tag & Note Release
on : 
  pull_request:    
    branches:
      - main
    types:
      - closed
concurrency:
  group: tag-note-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  tag:
    name: Create Tag & Release
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: macos-latest
    permissions:
      contents: write # required for creating tags and releases
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse version from branch name
        id: parse
        run: |
          version=$(echo "${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}" | sed 's/^release\///')
          echo "version=$version" >> $GITHUB_OUTPUT
        env:
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - name: Checkout release merge commit
        # zizmor: ignore[artipacked] Credentials are required by git-auto-commit-action to push the release tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: '0'
          persist-credentials: true
      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "refs/tags/${STEPS_PARSE_OUTPUTS_VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          STEPS_PARSE_OUTPUTS_VERSION: ${{ steps.parse.outputs.version }}
      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: version bump to ${{ steps.parse.outputs.version }}
          tagging_message: '${{ steps.parse.outputs.version }}'
      - name: Create release
        if: steps.tag_check.outputs.exists == 'false'
        run: gh release create "${STEPS_PARSE_OUTPUTS_VERSION}" --verify-tag --prerelease --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_PARSE_OUTPUTS_VERSION: ${{ steps.parse.outputs.version }}
  
  cocoapods:
    name: Publish to CocoaPods
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    needs: tag
    uses: ./.github/workflows/Push-CocoaPods.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
