project:
    id: fd4351af-4f70-4631-b2b7-8ab6550fe8f5
session:
    idle_timeout_seconds: 1800
build:
    framework: ios
    profiles:
        development:
            ios:
                app_id: 233ac861-fdf9-4f45-be6c-cb45045aab16
                # The demo app's Xcode project references the package at ../.., so the
                # whole repository is the build context, not Examples/HackerNewsDemo.
                build_commands:
                    - >-
                      xcodebuild
                      -project Examples/HackerNewsDemo/HackerNewsDemo.xcodeproj
                      -scheme HackerNewsDemo
                      -configuration Debug
                      -sdk iphonesimulator
                      -destination 'generic/platform=iOS Simulator'
                      -derivedDataPath build
                      -skipPackagePluginValidation
                      -skipMacroValidation
                      ARCHS=arm64
                      ONLY_ACTIVE_ARCH=NO
                      CODE_SIGN_IDENTITY=-
                      CODE_SIGNING_ALLOWED=YES
                      build
                output_path: build/Build/Products/Debug-iphonesimulator/HackerNewsDemo.app
                timeout_seconds: 2400
