receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp_grpc/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc/lgtm, debug]
    logs:
      receivers: [otlp]
      exporters: [otlp_grpc/lgtm, debug]
    metrics:
      receivers: [otlp]
      exporters: [otlp_grpc/lgtm, debug]
