<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="Ten launches plotted on the page-in ratio axis. Six warm launches cluster at 0.005 and four cold launches at 0.721, with no launch anywhere between 0.03 and 0.70. The 0.5 threshold sits inside that empty interval, and the gap between the clusters spans 23 binomial standard errors.">
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#1b2733"/></marker>
    <marker id="as" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M7 0 L0 3.5 L7 7 z" fill="#1b2733"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="300" fill="#ffffff"/>
