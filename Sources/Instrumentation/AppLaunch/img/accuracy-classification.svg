<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-label="Two strips on one axis compare the library's page-in ratio with the ratio derived from the Instruments trace. The library reads 0.721 on cold launches and 0.005 on warm ones. The trace measure saturates, reading exactly 1.000 on every cold launch and 0.000 on five of six warm ones. Both leave a wide empty interval around the 0.5 threshold.">
  <rect x="0" y="0" width="813.0" height="390" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#1b2733">
    <text x="20" y="26" font-size="14" font-weight="600">Figure 2. The two launch-type measures, n = 10</text>
    <text x="20" y="44" font-size="10.5" fill="#55606b">The measures share a threshold but not a denominator, so they separate the same launches without agreeing numerically.</text>
    <text x="20" y="60" font-size="10.5" fill="#55606b">Instruments reports no launch type of its own; the comparison script derives the lower row from the trace's virtual-memory events.</text>
        <rect x="233.9" y="118" width="426.3" height="64" fill="#f2f4f6"/>
    <text x="447.0" y="132" font-size="9.5" fill="#8b98a5" text-anchor="middle">no launch observed, 0.03 to 0.70</text>
    <rect x="279.4" y="200" width="575.6" height="64" fill="#f2f4f6"/>
    <text x="567.2" y="214" font-size="9.5" fill="#8b98a5" text-anchor="middle">no launch observed, 0.10 to 1.00</text>
    <line x1="535.0" y1="104" x2="535.0" y2="305" stroke="#9c7430" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="535.0" y="98" font-size="10" font-weight="600" fill="#9c7430" text-anchor="middle">threshold 0.5, the same constant on both sides</text>
    <line x1="215.0" y1="150" x2="855.0" y2="150" stroke="#dde3e9" stroke-width="1"/>
    <text x="203" y="146" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#33414e" text-anchor="end">library  page_in_ratio</text>
    <text x="203" y="159" font-size="9" fill="#8b98a5" text-anchor="end">paged_in / resident_at_end</text>
