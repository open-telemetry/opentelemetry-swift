    <text x="218.1" y="176" font-size="9.5" fill="#3b6ea5" text-anchor="middle" font-weight="600">0.005 ± 0.012</text>
    <text x="855.0" y="258" font-size="9.5" fill="#c0392b" text-anchor="middle" font-weight="600">1.000 ± 0.000</text>
    <text x="225.7" y="258" font-size="9.5" fill="#3b6ea5" text-anchor="middle" font-weight="600">0.017 ± 0.041</text>
