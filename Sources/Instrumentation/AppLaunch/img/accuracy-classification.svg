    <line x1="535.0" y1="300" x2="535.0" y2="305" stroke="#8b98a5" stroke-width="1"/>
    <text x="535.0" y="318" font-size="9.5" fill="#6b7580" text-anchor="middle">0.5</text>
    <line x1="599.0" y1="300" x2="599.0" y2="305" stroke="#8b98a5" stroke-width="1"/>
    <text x="599.0" y="318" font-size="9.5" fill="#6b7580" text-anchor="middle">0.6</text>
    <line x1="663.0" y1="300" x2="663.0" y2="305" stroke="#8b98a5" stroke-width="1"/>
    <text x="663.0" y="318" font-size="9.5" fill="#6b7580" text-anchor="middle">0.7</text>
    <line x1="727.0" y1="300" x2="727.0" y2="305" stroke="#8b98a5" stroke-width="1"/>
    <text x="727.0" y="318" font-size="9.5" fill="#6b7580" text-anchor="middle">0.8</text>
    <line x1="791.0" y1="300" x2="791.0" y2="305" stroke="#8b98a5" stroke-width="1"/>
    <text x="791.0" y="318" font-size="9.5" fill="#6b7580" text-anchor="middle">0.9</text>
    <line x1="855.0" y1="300" x2="855.0" y2="305" stroke="#8b98a5" stroke-width="1"/>
    <text x="855.0" y="318" font-size="9.5" fill="#6b7580" text-anchor="middle">1.0</text>
    <text x="535.0" y="336" font-size="10.5" fill="#33414e" text-anchor="middle">fraction of __TEXT pages read during the launch</text>
    <circle cx="215.0" cy="352" r="4.5" fill="#c0392b" fill-opacity="0.72" stroke="#c0392b"/><text x="223.6" y="355" font-size="10" fill="#33414e">cold (n = 4)</text>
    <circle cx="292.8" cy="352" r="4.5" fill="#3b6ea5" fill-opacity="0.72" stroke="#3b6ea5"/><text x="301.5" y="355" font-size="10" fill="#33414e">warm (n = 6)</text>
    <text x="20" y="382" font-size="9.5" fill="#55606b">The trace measure is effectively binary, so the ten launches agreeing tests the direction of the classification, not where the threshold sits.</text>
