    <path d="M628.5 160 v-5 H676.1 v5" fill="none" stroke="#c0392b" stroke-width="1.2"/>
    <text x="652.3" y="150" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="600">cold 0.721 ± 0.031 (n = 4)</text>
    <path d="M93.8 248 H652.3" stroke="#1b2733" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#as)"/>
    <text x="373.1" y="243" font-size="10.5" fill="#1b2733" text-anchor="middle" font-weight="600">gap 0.716 = 23 binomial standard errors at n = 256</text>
    <rect x="93.8" y="256" width="24.4" height="9" fill="#1b2733" fill-opacity="0.25"/>
    <text x="126.2" y="264" font-size="9.5" fill="#55606b">one standard error, 0.031</text>
    <text x="20" y="290" font-size="9.5" fill="#55606b">The shaded interval holds no measurement, so any threshold from about 0.1 to 0.6 would classify these ten launches identically.</text>
  </g>
</svg>