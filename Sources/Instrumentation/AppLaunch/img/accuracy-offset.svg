    <circle cx="538.0" cy="233" r="5" fill="#3b6ea5" fill-opacity="0.72" stroke="#3b6ea5" stroke-width="1.3"/>
    <circle cx="146.9" cy="233" r="5" fill="#3b6ea5" fill-opacity="0.72" stroke="#3b6ea5" stroke-width="1.3"/>
    <circle cx="443.0" cy="233" r="5" fill="#3b6ea5" fill-opacity="0.72" stroke="#3b6ea5" stroke-width="1.3"/>
    <circle cx="527.0" cy="233" r="5" fill="#c0392b" fill-opacity="0.72" stroke="#c0392b" stroke-width="1.3"/>
    <circle cx="592.9" cy="233" r="5" fill="#c0392b" fill-opacity="0.72" stroke="#c0392b" stroke-width="1.3"/>
    <circle cx="628.1" cy="233" r="5" fill="#c0392b" fill-opacity="0.72" stroke="#c0392b" stroke-width="1.3"/>
    <circle cx="100" cy="330" r="4.5" fill="#c0392b" fill-opacity="0.72" stroke="#c0392b"/><text x="110" y="333" font-size="10" fill="#33414e">cold</text>
    <circle cx="160" cy="330" r="4.5" fill="#3b6ea5" fill-opacity="0.72" stroke="#3b6ea5"/><text x="170" y="333" font-size="10" fill="#33414e">warm</text>
    <text x="20" y="352" font-size="9.5" fill="#55606b">A scatter of one refresh period identifies the display, not measurement noise, as the dominant term in the render offset.</text>
  </g>
</svg>