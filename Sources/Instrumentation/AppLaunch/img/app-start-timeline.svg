<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 696" width="940" height="696" role="img" aria-label="Timeline of the app.start and app.resume spans and their child spans">
  <rect x="0" y="0" width="940" height="696" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#1b2733">

    <text x="20" y="26" font-size="15" font-weight="600">The <tspan font-family="SF Mono, Menlo, Consolas, monospace" font-weight="600">app.start</tspan> and <tspan font-family="SF Mono, Menlo, Consolas, monospace" font-weight="600">app.resume</tspan> spans</text>
    <text x="20" y="44" font-size="11" fill="#55606b">Each phase is a child span. Widths follow the shares the integration tests measured, so they show the usual shape of a launch, not one launch.</text>

    <g font-size="10.5" fill="#33414e" text-anchor="middle">
      <text x="90" y="70">Process start</text>
      <text x="667" y="70">End of <tspan font-family="SF Mono, Menlo, Consolas, monospace">didFinishLaunching</tspan></text>
      <text x="860" y="70">First frame displayed</text>
      <text x="267" y="92"><tspan font-family="SF Mono, Menlo, Consolas, monospace">AppLaunchEnvironment</tspan> constructor</text>
      <text x="754" y="92" font-family="SF Mono, Menlo, Consolas, monospace">UIScene.willConnectNotification</text>
    </g>

    <g stroke="#c3ccd5" stroke-width="1" stroke-dasharray="2 3">
      <line x1="90" y1="76" x2="90" y2="126"/>
      <line x1="667" y1="76" x2="667" y2="126"/>
      <line x1="860" y1="76" x2="860" y2="126"/>
      <line x1="267" y1="98" x2="267" y2="126"/>
      <line x1="754" y1="98" x2="754" y2="218"/>
    </g>

    <rect x="90" y="126" width="770" height="38" rx="3" fill="#e4ecf6" stroke="#4a6fa5" stroke-width="1.25"/>
    <text x="475" y="150" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">app.start</text>

    <rect x="90" y="174" width="177" height="38" rx="3" fill="#d6e6f4" stroke="#3b6ea5" stroke-width="1.25"/>
    <rect x="267" y="174" width="400" height="38" rx="3" fill="#c6dcf0" stroke="#3b6ea5" stroke-width="1.25"/>
    <rect x="667" y="174" width="193" height="38" rx="3" fill="#b6d2ec" stroke="#3b6ea5" stroke-width="1.25"/>
    <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">
      <text x="178" y="194">app.start.pre_init</text>
      <text x="467" y="194">app.start.app_init</text>
      <text x="763" y="194">app.start.render</text>
    </g>
    <g font-size="9.5" fill="#40506b" text-anchor="middle">
      <text x="178" y="206">18% to 28%</text>
      <text x="467" y="206">46% to 59%</text>
      <text x="763" y="206">the remainder</text>
    </g>

    <rect x="754" y="218" width="106" height="32" rx="3" fill="#f2e3cd" stroke="#9c7430" stroke-width="1.25"/>
    <text x="807" y="238" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">scene_setup</text>
    <text x="744" y="238" font-size="10.5" fill="#33414e" text-anchor="end">child of <tspan font-family="SF Mono, Menlo, Consolas, monospace">app.start.render</tspan>, floored at its parent's start</text>

    <line x1="20" y1="282" x2="920" y2="282" stroke="#e1e6eb" stroke-width="1.25"/>
    <text x="20" y="306" font-size="11" fill="#55606b">A prewarmed launch instead starts where app code first ran, as <tspan font-family="SF Mono, Menlo, Consolas, monospace">activationStart</tspan> does in the W3C model.</text>

    <rect x="90" y="320" width="177" height="34" rx="3" fill="#ffffff" stroke="#8b98a5" stroke-width="1.25" stroke-dasharray="4 3"/>
    <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">
      <text x="178" y="336">app.start.pre_activation</text>
      <text x="178" y="348">.duration</text>
    </g>
    <rect x="267" y="320" width="593" height="34" rx="3" fill="#e4ecf6" stroke="#4a6fa5" stroke-width="1.25"/>
    <text x="563" y="341" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">app.start, when prewarmed</text>

    <g stroke="#c3ccd5" stroke-width="1" stroke-dasharray="2 3">
      <line x1="90" y1="312" x2="90" y2="320"/>
      <line x1="267" y1="312" x2="267" y2="320"/>
    </g>
    <g font-size="10.5" fill="#33414e" text-anchor="middle">
      <text x="90" y="372">Process start</text>
      <text x="267" y="372">App code first ran</text>
    </g>
    <text x="20" y="396" font-size="10.5" fill="#55606b">Recorded outside the span, not as a child of it: the process started before the user launched the app, so that time is not part of the launch.</text>

    <line x1="20" y1="420" x2="920" y2="420" stroke="#e1e6eb" stroke-width="1.25"/>
    <text x="20" y="444" font-size="11" fill="#55606b">A resume is its own span. The process stayed alive, so it has no launch phases, and it ends at the first frame as a launch does.</text>

    <g font-size="10.5" fill="#33414e" text-anchor="middle">
      <text x="110" y="476">App entered the background</text>
      <text x="860" y="476">First frame displayed</text>
    </g>
    <g stroke="#c3ccd5" stroke-width="1" stroke-dasharray="2 3">
      <line x1="90" y1="482" x2="90" y2="500"/>
      <line x1="860" y1="482" x2="860" y2="546"/>
      <line x1="478" y1="528" x2="478" y2="546"/>
      <line x1="372" y1="612" x2="372" y2="628"/>
      <line x1="478" y1="580" x2="478" y2="644"/>
    </g>

    <rect x="90" y="500" width="388" height="28" rx="3" fill="#ffffff" stroke="#8b98a5" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="284" y="519" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">app.resume.background_duration</text>

    <text x="420" y="541" font-size="9" fill="#55606b" text-anchor="middle"><tspan font-family="SF Mono, Menlo, Consolas, monospace">scene_reconnect</tspan> only</text>
    <rect x="372" y="546" width="106" height="34" rx="3" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.25" stroke-dasharray="4 3"/>
    <rect x="478" y="546" width="382" height="34" rx="3" fill="#e4ecf6" stroke="#4a6fa5" stroke-width="1.25"/>
    <text x="669" y="568" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">app.resume</text>

    <rect x="372" y="584" width="488" height="28" rx="3" fill="#f2e3cd" stroke="#9c7430" stroke-width="1.25"/>
    <text x="616" y="603" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">app.resume.scene_setup</text>

    <g font-size="10.5" fill="#33414e" text-anchor="middle">
      <text x="372" y="638" font-family="SF Mono, Menlo, Consolas, monospace">UIScene.willConnectNotification</text>
      <text x="478" y="654" font-family="SF Mono, Menlo, Consolas, monospace">willEnterForeground</text>
    </g>

    <text x="20" y="680" font-size="10.5" fill="#55606b"><tspan font-family="SF Mono, Menlo, Consolas, monospace">app.resume.background_duration</tspan> ends where the span starts, so a <tspan font-family="SF Mono, Menlo, Consolas, monospace">scene_reconnect</tspan> resume shortens it.</text>
  </g>
</svg>
