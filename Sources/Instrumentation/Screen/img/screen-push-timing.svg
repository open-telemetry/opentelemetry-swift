<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="Where the navigation event and the time to first draw span fall during one push, for UIKit and SwiftUI">
  <rect x="0" y="0" width="940" height="300" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#1b2733">
    <text x="20" y="26" font-size="15" font-weight="600">One push, close up</text>
    <text x="20" y="44" font-size="11" fill="#55606b">The event and the span end at different moments, and in a different order for each front end. Widths are not to scale.</text>

    <!-- UIKit -->
    <text x="20" y="122" font-size="11" font-weight="600">UIKit</text>
    <g font-size="10.5" fill="#33414e" text-anchor="middle">
      <text x="200" y="82"><tspan font-family="SF Mono, Menlo, Consolas, monospace">viewDidLoad</tspan></text>
      <text x="380" y="82"><tspan font-family="SF Mono, Menlo, Consolas, monospace">viewWillAppear(_:)</tspan></text>
      <text x="560" y="82">first frame</text>
      <text x="820" y="82"><tspan font-family="SF Mono, Menlo, Consolas, monospace">viewDidAppear(_:)</tspan></text>
    </g>
    <g stroke="#c3ccd5" stroke-width="1" stroke-dasharray="2 3">
      <line x1="200" y1="88" x2="200" y2="104"/>
      <line x1="380" y1="88" x2="380" y2="104"/>
      <line x1="560" y1="88" x2="560" y2="104"/>
    </g>
    <rect x="200" y="104" width="360" height="28" rx="3" fill="#e4ecf6" stroke="#4a6fa5" stroke-width="1.25"/>
    <text x="380" y="122" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#4a6fa5">app.screen.time_to_first_draw</text>
    <rect x="560" y="104" width="260" height="28" rx="3" fill="#ffffff" stroke="#8b98a5" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="690" y="122" font-size="10.5" fill="#55606b" text-anchor="middle">push transition</text>
    <line x1="820" y1="88" x2="820" y2="142" stroke="#4b9460" stroke-width="1.5"/>
    <circle cx="820" cy="146" r="5" fill="#4b9460"/>
    <text x="820" y="166" font-size="10" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" fill="#4b9460">app.navigation.complete</text>

    <!-- SwiftUI -->
    <text x="20" y="242" font-size="11" font-weight="600">SwiftUI</text>
    <g font-size="10.5" fill="#33414e" text-anchor="middle">
      <text x="200" y="202"><tspan font-family="SF Mono, Menlo, Consolas, monospace">ScreenTraceView</tspan> built</text>
      <text x="460" y="202"><tspan font-family="SF Mono, Menlo, Consolas, monospace">onAppear</tspan></text>
      <text x="600" y="202">first frame</text>
    </g>
    <g stroke="#c3ccd5" stroke-width="1" stroke-dasharray="2 3">
      <line x1="200" y1="208" x2="200" y2="224"/>
      <line x1="600" y1="208" x2="600" y2="224"/>
    </g>
    <rect x="200" y="224" width="400" height="28" rx="3" fill="#e4ecf6" stroke="#4a6fa5" stroke-width="1.25"/>
    <text x="320" y="242" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#4a6fa5">app.screen.time_to_first_draw</text>
    <line x1="460" y1="208" x2="460" y2="262" stroke="#4b9460" stroke-width="1.5"/>
    <circle cx="460" cy="266" r="5" fill="#4b9460"/>
    <text x="460" y="286" font-size="10" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" fill="#4b9460">app.navigation.complete</text>
  </g>
</svg>
