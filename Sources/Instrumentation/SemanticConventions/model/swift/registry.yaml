groups:
  - id: registry.swift.app_start
    type: attribute_group
    brief: >
      The app start attributes, recorded by `MincoreLaunchInstrumentation`.
    stability: development
    attributes:
      - id: app.start.type
        type:
          members:
            - id: cold
              value: "cold"
              stability: development
              brief: >
                The launch had to page in the app's code from disk: `app.start.sampled_page_in_ratio`
                was at least the configured threshold, 0.5 by default. If the code couldn't be sampled,
                the launch is classified from launch history instead.
            - id: warm
              value: "warm"
              stability: development
              brief: >
                The process was gone, but the app's code was already in memory: the page-in ratio was
                below the configured threshold. If the code couldn't be sampled, the launch is
                classified from launch history instead.
            - id: prewarmed
              value: "prewarmed"
              stability: development
              brief: >
                The system started the process before the user launched the app.
        stability: development
        brief: >
          How the launch began, as `PerformanceNavigationTiming.type` describes a navigation.
      - id: app.start.outcome
        type:
          members:
            - id: completed
              value: "completed"
              stability: development
              brief: >
                The launch reached its first frame.
            - id: abandoned
              value: "abandoned"
              stability: development
              brief: >
                The app became active, then left the foreground before its first frame.
            - id: crashed
              value: "crashed"
              stability: development
              brief: >
                The process crashed before its first frame. Reported by a crash reporter on the next
                launch, if at all.
        stability: development
        brief: >
          How the launch ended.
      - id: app.start.reason
        type:
          members:
            - id: user
              value: "user"
              stability: development
              brief: >
                The user launched the app directly.
            - id: notification
              value: "notification"
              stability: development
              brief: >
                The user opened a notification.
            - id: url
              value: "url"
              stability: development
              brief: >
                The system opened a URL in the app.
            - id: shortcut
              value: "shortcut"
              stability: development
              brief: >
                The user chose a Home Screen quick action.
            - id: user_activity
              value: "user_activity"
              stability: development
              brief: >
                The app continued a user activity.
        stability: development
        brief: >
          Why the app started.
        note: >
          Not recorded by this implementation yet. The launch options that carry it reach only the
          app delegate and the scene delegate, which this library doesn't hook.
      - id: app.start.determined_by
        type:
          members:
            - id: page_sampling
              value: "page_sampling"
              stability: development
              brief: >
                `app.start.sampled_page_in_ratio` compared with the configured page-in threshold, 0.5
                by default.
            - id: launch_history
              value: "launch_history"
              stability: development
              brief: >
                The launch's pages couldn't be sampled, so the type was inferred from what changed
                since the previous launch.
            - id: prewarm_flag
              value: "prewarm_flag"
              stability: development
              brief: >
                The `ActivePrewarm` environment variable was `1` when the process started.
        stability: development
        brief: >
          What decided `app.start.type`.
        note: >
          Not named `app.start.type.determined_by`, because OpenTelemetry attribute names can't also
          be namespaces.
      - id: app.start.sampled_pages.resident_at_end
        type: int
        stability: development
        brief: >
          How many sampled pages of the app's code were in the system's page cache when the app
          became active.
        note: >
          Up to 256 pages evenly spaced through the `__TEXT` segments of the app's images are
          sampled with `mincore`, which reports the page cache, so this includes pages left by
          earlier launches and read ahead by the kernel that this launch didn't use.
      - id: app.start.sampled_pages.total
        type: int
        stability: development
        brief: >
          How many pages of the app's code were sampled.
      - id: app.start.sampled_pages.paged_in
        type: int
        stability: development
        brief: >
          How many of `app.start.sampled_pages.resident_at_end` weren't in the page cache when this
          library's initializer ran, which is after the initializers of images it depends on.
      - id: app.start.sampled_page_in_ratio
        type: double
        stability: development
        brief: >
          The share of the sampled code that the launch paged in from disk (Apple's term for
          reading a page into memory): `app.start.sampled_pages.paged_in` divided by
          `app.start.sampled_pages.resident_at_end`, from 0 to 1. A launch is `cold` when this is
          at least the configured threshold, 0.5 by default.
      - id: app.start.page_ins.pre_initializer
        type: int
        stability: development
        brief: >
          The process's page-ins from process start to the page-sampling `constructor` function,
          `otel_app_launch_sample_pages_at_start`.
        note: >
          Not the same `constructor` function as `initializerStart`, which is
          `otel_app_launch_read_launch_environment` in a separate module, and the order the two run
          in isn't defined. So this isn't the boundary `app.start.pre_init` ends at, even though
          both are an initializer.
      - id: app.start.page_ins.post_initializer
        type: int
        stability: development
        brief: >
          The process's page-ins from the page-sampling `constructor` function,
          `otel_app_launch_sample_pages_at_start`, to the end of the span.
      - id: app.start.prewarm.cache_state
        type:
          members:
            - id: cold
              value: "cold"
              stability: development
              brief: >
                `app.start.sampled_page_in_ratio` is at least the configured threshold, 0.5 by default.
            - id: warm
              value: "warm"
              stability: development
              brief: >
                `app.start.sampled_page_in_ratio` is less than the configured threshold, 0.5 by default.
        stability: development
        brief: >
          Whether a prewarmed launch still had to bring the app's code into memory. Diagnostic only:
          it doesn't change `app.start.type`.
      - id: app.start.previous_exit
        type:
          members:
            - id: clean
              value: "clean"
              stability: development
              brief: >
                The previous process exited normally.
            - id: crash
              value: "crash"
              stability: development
              brief: >
                The previous process crashed.
            - id: background_kill
              value: "background_kill"
              stability: development
              brief: >
                The system ended the previous process in the background.
            - id: unknown
              value: "unknown"
              stability: development
              brief: >
                How the previous process ended isn't known.
        stability: development
        brief: >
          How the previous process ended.
        note: >
          Not recorded by this implementation yet. It needs state carried over from the previous
          process, such as a crash report or an exit metric.
      - id: app.start.pre_activation.duration
        type: double
        stability: development
        brief: >
          Seconds from process start to `activationStart` on a prewarmed launch, which the span
          doesn't cover. Not part of the launch's duration.
      - id: app.start.pre_init.duration
        type: double
        stability: development
        brief: >
          The duration of `app.start.pre_init` in seconds.
      - id: app.start.app_init.duration
        type: double
        stability: development
        brief: >
          The duration of `app.start.app_init` in seconds.
      - id: app.start.render.duration
        type: double
        stability: development
        brief: >
          The duration of `app.start.render` in seconds.
  - id: registry.swift.app_resume
    type: attribute_group
    brief: >
      The app resume attributes, recorded by `MincoreLaunchInstrumentation`.
    stability: development
    attributes:
      - id: app.resume.type
        type:
          members:
            - id: hot
              value: "hot"
              stability: development
              brief: >
                The process was alive with its scene still connected, so its UI was already built.
            - id: scene_reconnect
              value: "scene_reconnect"
              stability: development
              brief: >
                The system discarded the scene in the background, so it reconnected.
            - id: background_launched
              value: "background_launched"
              stability: development
              brief: >
                The process started in the background and had never been active.
        stability: development
        brief: >
          How much UI the resume had to rebuild.
      - id: app.resume.outcome
        type:
          members:
            - id: completed
              value: "completed"
              stability: development
              brief: >
                The resume reached its first frame.
            - id: abandoned
              value: "abandoned"
              stability: development
              brief: >
                The app became active, then left the foreground before its first frame.
        stability: development
        brief: >
          How the resume ended.
      - id: app.resume.reason
        type:
          members:
            - id: user
              value: "user"
              stability: development
              brief: >
                The user returned to the app directly.
            - id: notification
              value: "notification"
              stability: development
              brief: >
                The user opened a notification.
            - id: url
              value: "url"
              stability: development
              brief: >
                The system opened a URL in the app.
            - id: shortcut
              value: "shortcut"
              stability: development
              brief: >
                The user chose a Home Screen quick action.
            - id: user_activity
              value: "user_activity"
              stability: development
              brief: >
                The app continued a user activity.
        stability: development
        brief: >
          Why the app resumed.
        note: >
          Not recorded by this implementation yet. The connection options that carry it reach only
          the scene delegate, which this library doesn't hook.
      - id: app.resume.background.duration
        type: double
        stability: development
        brief: >
          Seconds from when the app last entered the background to the start of the resume.
      - id: app.resume.page_ins
        type: int
        stability: development
        brief: >
          The process's page-ins during the resume, which reveal pages evicted while it was
          suspended.
        note: >
          Counts the whole process, not the app's code, from the system telling the app it will
          enter the foreground to the end of the span. Not reported if the counter can't be read,
          or if it went backwards, which would mean it was reset.
      - id: app.resume.sampled_pages.total
        type: int
        stability: development
        brief: >
          How many pages of the app's code were sampled, the same pages the launch sampled.
      - id: app.resume.sampled_pages.resident_at_end
        type: int
        stability: development
        brief: >
          How many sampled pages of the app's code were in memory at the end of the resume.
      - id: app.resume.sampled_pages.paged_in
        type: int
        stability: development
        brief: >
          How many sampled pages of the app's code came back into memory between the app entering
          the background and the end of the resume, so how much of its own code the system had
          reclaimed while it was away.
        note: >
          Unlike `app.resume.page_ins`, this counts only the app's code, so it isn't affected by
          the rest of what the process read. It's recorded only for a resume the app entered the
          background before, because that's when the baseline is taken.
      - id: app.resume.sampled_page_in_ratio
        type: double
        stability: development
        brief: >
          `app.resume.sampled_pages.paged_in` divided by
          `app.resume.sampled_pages.resident_at_end`, from 0 to 1.
