groups:
  - id: span.app_screen.time_to_first_draw
    type: span
    annotations:
      span_name: app.screen.time_to_first_draw
    span_kind: internal
    stability: development
    brief: >
      A screen's time to first draw, from the screen's creation to the first
      frame displayed.
    note: |
      **Span name** MUST be `app.screen.time_to_first_draw`.

      **Span kind** MUST be `INTERNAL`.

      **Instrumentation scope** MUST be `io.opentelemetry.screen.uikit` for a
      `uikit` screen and `io.opentelemetry.screen.swiftui` for a `swiftui` one.

      One span per screen instance, not per appearance: a screen the user
      returns to records nothing the second time.

      | `app.screen.type` | Start timestamp | End timestamp |
      | --- | --- | --- |
      | `uikit` | The view controller's `viewDidLoad` | The first frame displayed after its first `viewWillAppear` |
      | `swiftui` | SwiftUI created the view's state | The first frame displayed after its first `onAppear` |

      The end is read from the display link: the second refresh after the
      start of the read, when a frame committed in the first is displayed.
      Neither end includes the transition animation. Where no display link
      exists, on macOS and watchOS, a `swiftui` span ends at `onAppear`.

      An app that enters the background before the first frame records
      nothing for that screen.

      The span measures the screen's own work only when the screen is created
      to be shown. UIKit loads a view controller the first time something asks
      for its view, which a parent can do long before it presents it, and a view
      controller can load and never appear. Such a screen reports a long span
      or none at all, and no attribute distinguishes it, so a consumer should
      read the distribution rather than a single span.

      A screen never appearing records nothing, so an abandoned navigation is
      invisible here.
    attributes:
      - ref: app.screen.type
        requirement_level: required
