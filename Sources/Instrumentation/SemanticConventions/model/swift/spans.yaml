groups:
  - id: span.app_start.internal
    type: span
    span_kind: internal
    stability: development
    brief: >
      An app activation, from when the system began starting or resuming the app to the first frame
      displayed after the app became active.
    note: |
      **Span name** MUST be `AppStart`.

      **Span kind** MUST be `INTERNAL`.

      **Instrumentation scope** MUST be `io.opentelemetry.lifecycle`, the same as OpenTelemetry Android.

      The span's start and end timestamps depend on `start.type` and `start.active_prewarmed`:

      | `start.type` | `start.active_prewarmed` | Start timestamp | End timestamp |
      | --- | --- | --- | --- |
      | `cold` | `false` or not set | Process start, as reported by the kernel (`sysctl` `KERN_PROC_PID`, `kp_proc.p_starttime`). | The first frame displayed after the app first becomes active (`UIApplication.didBecomeActiveNotification`). |
      | `warm` | `false` or not set | Process start, as for `cold`. | As for `cold`. |
      | `cold` | `true` | The earliest time app code ran in the process, recorded by a C `constructor` function before `main()`. Process start can be long before the user launched a prewarmed app, so it isn't used. | As for `cold`. |
      | `warm` | `true` | As for prewarmed `cold`. | As for `cold`. |
      | `prewarmed` | `true` | As for prewarmed `cold`. | As for `cold`. |
      | `resume` | not set | `UIApplication.willEnterForegroundNotification`, including the first time the app enters the foreground after the system started its process in the background. If the system discarded the app's scene while the app was in the background, the new scene connects first, and the span starts at `UIScene.willConnectNotification` instead, as long as the app starts entering the foreground while handling the same event. | The first frame displayed after the next `UIApplication.didBecomeActiveNotification`. |

      The first frame is read with a `CADisplayLink`. A frame committed before a display refresh
      is rendered during it and displayed at the next one, so the end timestamp is the link's
      `timestamp` at its second callback, converted to wall-clock time. This matches Apple's
      launch-time metric, which runs to the first frame. The end timestamp is never earlier than
      the `didBecomeActiveNotification`. On platforms without `CADisplayLink`,
      such as macOS, the span ends at the app's `didBecomeActiveNotification` instead.

      If the time of the earliest app code can't be read, a prewarmed launch starts at process
      start.

      The span MUST NOT be recorded when:

      - The process start time can't be read, for `cold` and `warm`.
      - The app returns to the background before it becomes active, for `resume`.
      - The app enters the background after it becomes active but before the first frame is
        displayed, for every `start.type`.
      - A `cold` or `warm` span would be longer than the maximum launch duration (60 seconds by
        default). The user can't have waited through all of it, for example because a background
        launch wasn't detected.
      - The launch was prewarmed and the instrumentation is configured to drop prewarmed launches.
      - The app becomes active without first entering the background, for example after the user
        dismisses Control Center or a system alert. The app only lost input focus.

      A process the system started in the background, or that entered the background before it
      first became active, has no `cold` or `warm` span. Its first activation is a `resume`,
      because the process was already alive.
    attributes:
      - ref: start.type
        requirement_level: required
      - ref: start.active_prewarmed
        requirement_level:
          conditionally_required: If `start.type` is `cold`, `warm` or `prewarmed`.
      - ref: start.sampled_pages.resident_at_end
        requirement_level:
          conditionally_required: If the launch type was measured.
      - ref: start.sampled_pages.paged_in
        requirement_level:
          conditionally_required: If the launch type was measured.
      - ref: start.sampled_page_in_ratio
        requirement_level:
          conditionally_required: If the launch type was measured.
  - id: span.app_start.v2
    type: span
    span_kind: internal
    stability: development
    brief: >
      Version 2 of the app launch span, from when the launch began to the first frame displayed.
    note: |
      **Span name** MUST be `app.start`.

      **Span kind** MUST be `INTERNAL`.

      **Instrumentation scope** MUST be `io.opentelemetry.lifecycle` with version `2.0.0`.

      This schema models a launch on W3C `PerformanceNavigationTiming`: a time origin, `xxxStart`
      and `xxxEnd` timestamps, a `type` and an `activationStart`. It uses no span events, because
      OpenTelemetry is deprecating them. Each phase between two timestamps is a child span.

      | Timestamp | Marks | W3C analog |
      | --- | --- | --- |
      | `processStart` | Process start, the time origin (`sysctl` `KERN_PROC_PID`, `kp_proc.p_starttime`) | `startTime` |
      | `initializerStart` | The C `constructor` function of the instrumentation ran | none |
      | `activationStart` | A prewarmed launch resumed. The same time as `initializerStart`, because Apple says a prewarm runs no application code | `activationStart` |
      | `didFinishLaunchingEnd` | `didFinishLaunchingNotification`, if the instrumentation was installed before it | `domContentLoadedEventEnd` |
      | `sceneConnectStart` | The first `UIScene.willConnectNotification` of the launch | none |
      | `firstFrameDisplayed` | The first frame displayed after `didBecomeActive`, read as for `AppStart` | First paint |

      The span's timestamps depend on `app.start.type`:

      | `app.start.type` | Start timestamp | End timestamp |
      | --- | --- | --- |
      | `cold`, `warm` | `processStart` | `firstFrameDisplayed` |
      | `prewarmed` | `activationStart`, or `processStart` if that can't be read | `firstFrameDisplayed` |

      If `app.start.outcome` is `abandoned`, the span and its open children end when the app entered
      the background instead. Leaving before the app first becomes active records no span, because
      that can't be told apart from a background launch.

      A phase is only recorded if both of its timestamps are known:

      | Span | Parent | Start | End | When |
      | --- | --- | --- | --- | --- |
      | `app.start.pre_init` | `app.start` | `processStart` | `initializerStart` | Not prewarmed |
      | `app.start.app_init` | `app.start` | `initializerStart` | `didFinishLaunchingEnd` | |
      | `app.start.render` | `app.start` | `didFinishLaunchingEnd` | The end of `app.start` | |
      | `app.start.scene_setup` | `app.start.render` | `sceneConnectStart` | The end of `app.start` | |

      Child spans have no attributes. `app.start.pre_init`, `app.start.app_init` and
      `app.start.render` cover the whole span with no gaps, so their durations add up to its
      duration. The duration attributes copy them onto the root, so they can be queried without
      joining spans.
    attributes:
      - ref: app.start.type
        requirement_level: required
      - ref: app.start.outcome
        requirement_level: required
      - ref: app.start.determined_by
        requirement_level: required
      - ref: app.start.reason
        requirement_level: opt_in
      - ref: app.start.previous_exit
        requirement_level: opt_in
      - ref: app.start.sampled_pages.resident_at_end
        requirement_level:
          conditionally_required: If the launch's pages could be sampled.
      - ref: app.start.sampled_pages.paged_in
        requirement_level:
          conditionally_required: If the launch's pages could be sampled.
      - ref: app.start.sampled_page_in_ratio
        requirement_level:
          conditionally_required: If the launch's pages could be sampled.
      - ref: app.start.prewarm.cache_state
        requirement_level:
          conditionally_required: If `app.start.type` is `prewarmed` and the pages could be sampled.
      - ref: app.start.page_ins.pre_initializer
        requirement_level: recommended
      - ref: app.start.page_ins.post_initializer
        requirement_level: recommended
      - ref: app.start.pre_activation.duration
        requirement_level:
          conditionally_required: If `app.start.type` is `prewarmed`.
      - ref: app.start.pre_init.duration
        requirement_level:
          conditionally_required: If `app.start.pre_init` is recorded.
      - ref: app.start.app_init.duration
        requirement_level:
          conditionally_required: If `app.start.app_init` is recorded.
      - ref: app.start.render_delay.duration
        requirement_level:
          conditionally_required: If `app.start.render` is recorded.
  - id: span.app_resume.v2
    type: span
    span_kind: internal
    stability: development
    brief: >
      Version 2 of the app resume span. A resume is its own span, not a launch type, because the
      process is already alive and there's no `processStart`.
    note: |
      **Span name** MUST be `app.resume`.

      **Span kind** MUST be `INTERNAL`.

      **Instrumentation scope** MUST be `io.opentelemetry.lifecycle` with version `2.0.0`.

      The span starts at `sceneConnectStart` if a scene connected as the app returned to the
      foreground, because UIKit connects it first, and otherwise at
      `UIApplication.willEnterForegroundNotification`. It ends at the first frame displayed after
      the next `UIApplication.didBecomeActiveNotification`, or when the app entered the background
      if `app.resume.outcome` is `abandoned`.

      A child span `app.resume.scene_setup` runs from `sceneConnectStart` to the end of `app.resume`
      if a scene connected. Regaining focus without entering the background records no span.
    attributes:
      - ref: app.resume.type
        requirement_level: required
      - ref: app.resume.outcome
        requirement_level: required
      - ref: app.resume.reason
        requirement_level: opt_in
      - ref: app.resume.background.duration
        requirement_level:
          conditionally_required: If the app entered the background earlier in this process.
      - ref: app.resume.page_ins
        requirement_level: opt_in
  - id: metric.app.start.duration
    type: metric
    metric_name: app.start.duration
    instrument: histogram
    unit: s
    stability: development
    brief: >
      The duration of each completed `app.start` span.
    attributes:
      - ref: app.start.type
        requirement_level: required
  - id: metric.app.resume.duration
    type: metric
    metric_name: app.resume.duration
    instrument: histogram
    unit: s
    stability: development
    brief: >
      The duration of each completed `app.resume` span.
    attributes:
      - ref: app.resume.type
        requirement_level: required
