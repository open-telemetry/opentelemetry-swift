groups:
  - id: span.app_start.internal
    type: span
    span_kind: internal
    stability: development
    brief: >
      An app activation, from when the system began starting or resuming the app to the first frame
      displayed after the app became active.
    note: |
      **Span name** MUST be `AppStart`.

      **Span kind** MUST be `INTERNAL`.

      **Instrumentation scope** MUST be `io.opentelemetry.lifecycle`, the same as OpenTelemetry Android.

      The span's start and end timestamps depend on `start.type` and `start.active_prewarmed`:

      | `start.type` | `start.active_prewarmed` | Start timestamp | End timestamp |
      | --- | --- | --- | --- |
      | `cold` | `false` or not set | Process start, as reported by the kernel (`sysctl` `KERN_PROC_PID`, `kp_proc.p_starttime`). | The first frame displayed after the app first becomes active (`UIApplication.didBecomeActiveNotification`). |
      | `warm` | `false` or not set | Process start, as for `cold`. | As for `cold`. |
      | `cold` | `true` | The earliest time app code ran in the process, recorded by a C `constructor` function before `main()`. Process start can be long before the user launched a prewarmed app, so it isn't used. | As for `cold`. |
      | `warm` | `true` | As for prewarmed `cold`. | As for `cold`. |
      | `resume` | not set | `UIApplication.willEnterForegroundNotification`. If the system discarded the app's scene while the app was in the background, the new scene connects first, and the span starts at `UIScene.willConnectNotification` instead. | The first frame displayed after the next `UIApplication.didBecomeActiveNotification`. |

      The first frame is read with a one-shot `CADisplayLink`, and its timestamp is converted to
      wall-clock time. This matches Apple's launch-time metric, which runs to the first frame. The
      end timestamp is never earlier than the `didBecomeActiveNotification`, because the display
      link can report the frame displayed just before it. On platforms without `CADisplayLink`,
      such as macOS, the span ends at the app's `didBecomeActiveNotification` instead.

      If the time of the earliest app code can't be read, a prewarmed launch starts at process
      start.

      The span MUST NOT be recorded when:

      - The process start time can't be read, for `cold` and `warm`.
      - The app returns to the background before it becomes active, for `resume`.
      - The app enters the background after it becomes active but before the first frame is
        displayed, for every `start.type`.
      - A `cold` or `warm` span would be longer than the maximum launch duration (60 seconds by
        default). The user can't have waited through all of it, for example because the system
        launched the app in the background.
      - The launch was prewarmed and the instrumentation is configured to drop prewarmed launches.
      - The app becomes active without first entering the background, for example after the user
        dismisses Control Center or a system alert. The app only lost input focus.
    attributes:
      - ref: start.type
        requirement_level: required
      - ref: start.active_prewarmed
        requirement_level:
          conditionally_required: If `start.type` is `cold` or `warm`.
