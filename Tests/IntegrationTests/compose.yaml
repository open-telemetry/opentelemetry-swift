# Alternative backend for Scripts/run-integration-tests.sh --collector docker.
# Mirrors the demo-app setup in opentelemetry-android but swaps Jaeger for the
# file exporter so the assertions can read what was received.
services:
  collector:
    image: "otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6"
    volumes:
      - ./collector.yaml:/etc/integration-collector.yaml:ro
      - ${OTEL_INTEGRATION_OUTPUT_DIR:-./out}:/out
    entrypoint: ["/otelcol-contrib"]
    command: ["--config", "/etc/integration-collector.yaml"]
    ports:
      - "${OTEL_INTEGRATION_PORT:-4318}:4318" # OTLP HTTP
